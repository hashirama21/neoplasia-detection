_target_: src.data.datamodule.Rare26DataModule

train_csv: ${paths.data_dir}/train.csv
val_selection_csv: ${paths.data_dir}/val_selection.csv
val_calibration_csv: ${paths.data_dir}/val_calibration.csv

image_size: 336
batch_size: 16
num_workers: ${num_workers}
pin_memory: ${pin_memory}

# Class imbalance — 158 pos / 2937 neg
pos_weight_factor: 18.6
weighted_sampler: true
oversample_factor: 3.0

# Stratified split of official validation set
val_split_seed: 42
val_selection_ratio: 0.70

augmentation:
  train:
    random_resized_crop:
      scale: [0.7, 1.0]
      ratio: [0.9, 1.1]
    horizontal_flip: 0.5
    vertical_flip: 0.3
    rotation_degrees: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.3
      saturation: 0.2
      hue: 0.05
    # Endoscopy-specific augmentations
    specular_highlight_prob: 0.3
    nbi_simulation_prob: 0.2
    motion_blur_prob: 0.2
    gaussian_noise_prob: 0.2
  val:
    resize: 336
    center_crop: 336

normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
