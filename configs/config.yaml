defaults:
  - model: dinov2_gastronet
  - data: rare26
  - training: base
  - calibration: isotonic
  - inference: tta_ensemble
  - _self_

project:
  name: rare26
  seed: 42
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  experiment_name: baseline

paths:
  data_dir: data/
  weights_dir: weights/
  checkpoint_dir: ${project.output_dir}/checkpoints
  logs_dir: ${project.output_dir}/logs
  results_dir: ${project.output_dir}/results

device: cuda
num_workers: 8
pin_memory: true

hydra:
  run:
    dir: ${project.output_dir}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
