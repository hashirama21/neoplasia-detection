_target_: src.inference.predictor.EnsemblePredictor

# TTA configuration
tta:
  enabled: true
  n_views: 8
  transforms:
    - name: original
    - name: hflip
    - name: vflip
    - name: hflip_vflip
    - name: rotate_15
    - name: rotate_neg15
    - name: saturation_jitter
    - name: contrast_jitter

# Ensemble configuration
ensemble:
  n_models: 5
  # mean_logits : average logits then sigmoid. Assumes exchangeable models.
  # noisy_or    : 1 - prod(1 - p_i). Correct for detection ensembles.
  aggregation: noisy_or
  calibrate_after_ensemble: true
  # uncertainty_penalty: raise effective threshold by penalty × std(probs).
  # 0.0 = disabled. 0.3–0.5 reduces false positives on uncertain cases.
  uncertainty_penalty: 0.0

# Decision threshold — set after calibration, hardcoded for Docker
threshold: 0.5  # overwritten by calibration script output

# Batch size for inference
batch_size: 32
